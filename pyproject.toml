[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-segmentation"
version = "0.1.0"
description = "Rimozione del docente dalla lavagna nei video delle lezioni"
authors = [{ name = "Lorenzo Londero" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=5.0.0",
    "numpy>=2.0",
    "mediapipe>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.5",
    "ipywidgets>=8.1",
    "matplotlib>=3.10",
    "pytest>=8.0",
]

[project.scripts]
lavagna = "image_segmentation.main:main"

[tool.setuptools.packages.find]
where = ["src"]
