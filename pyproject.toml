[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-toolkit"
version = "0.1.0"
description = "Image and video processing toolkit: reusable layers (core, tasks, models, ops) and use cases built on them"
authors = [{ name = "Lorenzo Londero" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=5.0.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
# One extra per model backend
mediapipe = ["mediapipe>=1.1.0"]
dev = [
    "jupyterlab>=4.5",
    "ipywidgets>=8.1",
    "matplotlib>=3.10",
    "pytest>=8.0",
]

[project.scripts]
vision-toolkit = "vision_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
